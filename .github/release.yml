# GitHub automatic release notes configuration
# Reference: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - ignore-for-release
      - automated
    authors:
      - dependabot[bot]
  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - enhancement
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking-change
    - title: "📝 Documentation"
      labels:
        - documentation
        - docs
    - title: "🧪 Tests & CI/CD"
      labels:
        - testing
        - ci
        - azure-devops
    - title: "📦 Dependency Updates"
      labels:
        - dependencies
    - title: "🧰 Maintenance & Chores"
      labels:
        - maintenance
        - chore

